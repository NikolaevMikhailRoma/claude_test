<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Шутка дня</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f5f5;
    font-family: system-ui, sans-serif;
    color: #222;
  }
  .card {
    max-width: 480px;
    padding: 2rem;
    text-align: center;
  }
  h1 {
    font-size: 1.1rem;
    color: #888;
    margin: 0 0 1rem;
  }
  #joke {
    font-size: 1.4rem;
    line-height: 1.5;
    margin: 0 0 1.5rem;
  }
  button {
    font-size: 1rem;
    padding: 0.6rem 1.2rem;
    border: none;
    border-radius: 6px;
    background: #333;
    color: #fff;
    cursor: pointer;
  }
  button:hover {
    background: #555;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Шутка дня</h1>
    <p id="joke"></p>
    <button id="btn">Ещё шутку</button>
  </div>

  <script>
    var jokes = [
      "Программист — это устройство, превращающее кофе в код.",
      "У нас всего два бага: тот, что мы нашли, и тот, что нашёл пользователь.",
      "Работает на моей машине — значит, готово к продакшену.",
      "999 маленьких багов в коде, 999 маленьких багов... исправь один, добавь два новых."
    ];

    function showJoke() {
      var i = Math.floor(Math.random() * jokes.length);
      document.getElementById("joke").textContent = jokes[i];
    }

    document.getElementById("btn").addEventListener("click", showJoke);
    showJoke();
  </script>
</body>
</html>
